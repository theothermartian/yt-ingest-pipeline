<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      width: 340px;
      min-height: 160px;
      padding: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #ff4444;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h1 span.dot {
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      display: inline-block;
    }

    #page-info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 14px;
      word-break: break-all;
      line-height: 1.4;
    }

    #page-info .title {
      color: #ddd;
      font-weight: 500;
      margin-bottom: 4px;
    }

    #page-info .url {
      color: #888;
      font-size: 11px;
    }

    #not-youtube {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) {
      background: #cc2222;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: default;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #aaa;
    }

    #status.success { color: #4caf50; }
    #status.error   { color: #ff4444; }

    .separator {
      border: none;
      border-top: 1px solid #222;
      margin: 12px 0;
    }

    #recent-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }

    #recent-list {
      list-style: none;
      font-size: 11px;
      color: #888;
      max-height: 90px;
      overflow-y: auto;
    }

    #recent-list li {
      padding: 3px 0;
      border-bottom: 1px solid #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #recent-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>YT Ingest Bookmarker</h1>

  <div id="page-info">
    <div class="title" id="video-title">Loading...</div>
    <div class="url" id="video-url"></div>
  </div>

  <div id="not-youtube" style="display:none;">
    Not a YouTube page.<br>Navigate to a YouTube video to bookmark it.
  </div>

  <button id="bookmark-btn" disabled>Bookmark this video</button>
  <div id="status"></div>

  <hr class="separator">
  <div id="recent-label">Recently bookmarked</div>
  <ul id="recent-list"><li style="color:#555">None yet</li></ul>

  <script src="popup.js"></script>
</body>
</html>
